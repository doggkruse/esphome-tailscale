name: Validate ESPHome config

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'packages/**'
      - 'microlink/**'
      - 'example.yaml'
      - 'example-dev.yaml'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'packages/**'
      - 'microlink/**'
      - 'example.yaml'
      - 'example-dev.yaml'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate local public example, package and memory profiles
        run: python scripts/check_public_examples.py

      - name: Check pinned local Git component loading
        run: python scripts/check_git_install.py

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [no-psram, psram]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache ESPHome build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .esphome
            examples/.esphome
          key: esphome-compile-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('components/tailscale/__init__.py', 'microlink/components/microlink/CMakeLists.txt') }}
          restore-keys: |
            esphome-compile-${{ runner.os }}-${{ matrix.profile }}-

      - name: Compile no-PSRAM endpoint (never upload)
        if: matrix.profile == 'no-psram'
        run: esphome compile examples/endpoint-build.yaml

      - name: Verify compiled no-PSRAM profile
        if: matrix.profile == 'no-psram'
        run: >-
          python scripts/check_memory_build.py
          --build-dir examples/.esphome/build/tailscale-wroom-endpoint
          --profile no-psram

      - name: Compile public PSRAM example with local candidate package (never upload)
        if: matrix.profile == 'psram'
        run: python scripts/check_public_examples.py --compile-public-example

      - name: Python and native protocol/allocation checks
        if: matrix.profile == 'no-psram'
        run: |
          python -m pytest -q
          python scripts/run_native_checks.py
