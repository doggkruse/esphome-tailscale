# Compile-only fixture. Do not flash these placeholder credentials.
esphome:
  name: tailscale-s3-endpoint
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
external_components:
  - source: ../components
logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
wifi:
  ssid: compile-only-not-a-real-network
  password: compile-only-password
  reboot_timeout: 0s
tailscale:
  auth_key: compile-only-not-an-auth-key
  max_peers: 16
  disable_telemetry: true

time:
  - platform: sntp
    id: system_clock

# S3 octal-PSRAM compile coverage only; no hardware qualification.
psram:
  mode: octal
  speed: 80MHz
